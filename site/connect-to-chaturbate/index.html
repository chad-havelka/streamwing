<script>
// Setup only. StreamWing itself lives at /owl/.
// A visit that carries a StreamWing key in the address, or a browser that has one saved, is sent on to /owl/.
// Keep this for as long as saved links in the old form /connect-to-chaturbate/#k=... exist.
(function () {
  if (location.hash === '#demo') return location.replace('/owl/#demo');
  var m = location.hash.match(/k=([\w-]{20,})/), k = m ? m[1] : '';
  if (!k) try { k = localStorage.getItem('sw_k') || ''; } catch (e) {}
  if (k) location.replace('/owl/#k=' + k);
})();
</script>

button{font:inherit}

header{position:sticky;top:0;z-index:5;background:rgba(22,12,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}

<script>
{
const API = (location.hostname === 'localhost' && localStorage.getItem('sw_api')) || 'https://streamwing-production.up.railway.app';
const app = document.getElementById('app');

// Safe DOM building. Nothing is ever set as HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}

function setup() {
  const ta = h('textarea', { id: 'eventsUrl', placeholder: 'Paste the link from Chaturbate here', 'aria-label': 'The link from Chaturbate', autocomplete: 'off', spellcheck: 'false' });
  const msg = h('p', { class: 'msg', 'aria-live': 'polite' });
  let busy = false;
  // Chaturbate's live site, and its testbed so changes can be checked before a streamer sees them.
  const LINK_OK = /^https:\/\/(eventsapi\.chaturbate\.com|events\.testbed\.cb\.dev)\/events\//;
  const go = async () => {
    if (busy || !ta.value.trim()) return;
    if (!LINK_OK.test(ta.value.trim())) {
      ta.value = '';
      msg.className = 'msg err';
      msg.textContent = 'That is not the StreamWing link. Right-click the long link on the StreamWing row and paste it here. It starts with https://eventsapi.chaturbate.com/events/';
      return;
    }
    busy = true; msg.className = 'msg'; msg.textContent = 'Checking with Chaturbate…'; btn.disabled = true;
    try {
      // The Chaturbate link creates the account (or finds it) and gives us her StreamWing key.
      const r = await fetch(API + '/api/open-account', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ eventsUrl: ta.value.trim() }) });
      let body = {}; try { body = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error(body.error || 'Something went wrong.');
      const key = body.link.split('#k=')[1];
      try { localStorage.setItem('sw_k', key); } catch (e) {}
      msg.textContent = 'Connected. Opening StreamWing…';
      location.assign('/owl/#k=' + key);
    }
    catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    finally { busy = false; btn.disabled = false; }
  };
  const btn = h('button', { class: 'btn', type: 'button', onclick: go }, 'Connect');
  // Pasting the link is the last step, so connect as soon as it lands.
  ta.addEventListener('paste', () => setTimeout(go, 80));
  const step = (num, title, ...kids) => h('div', { class: 'step' }, h('div', { class: 'n' }, num), h('div', { class: 'body' }, h('h2', {}, title), ...kids));
  const shot = 'display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)';
  const formPic = h('div', {},
    h('img', { src: '/connect-to-chaturbate/connect-step-2-token-form.jpg', alt: 'The Chaturbate token page with Token Name set to StreamWing, Stats API unticked, and Events API (public) ticked', style: shot }),
    h('p', { class: 'cbcap' }, 'A picture of Chaturbate’s page. Yours may look a little different. Only Events API (public) gets a tick.'));
  const linkPic = h('div', {},
    h('img', { src: '/connect-to-chaturbate/connect-step-3-token-row.jpg', alt: 'The Chaturbate token table with the StreamWing row and a right-click menu open on its link', style: shot }),
    h('p', { class: 'cbcap' }, 'Find the row named StreamWing. Under Scope it should say Events API (public). Right-click the long link. You do not need to highlight it. Older rows above it are from tokens you made before.'));
  const pasteKids = [
    h('p', { style: 'margin-top:12px' }, 'Paste the long link from Chaturbate to connect your room. If you already have a StreamWing link, open that instead.'),
    h('div', { style: 'margin-top:12px' }, ta), h('div', { style: 'margin-top:12px' }, btn), msg];
  app.replaceChildren(h('div', {},
    h('p', { class: 'kicker' }, 'Setup'),
    h('h1', {}, 'Connect your Chaturbate room.'),
    h('p', {}, 'StreamWing reads your Chaturbate room and tells you who is in it: regulars who came back, big tippers, and people with tokens who haven’t tipped you yet. It only reads. It never posts in your room, messages or tips for you, and it never touches your account.'),
    h('div', { style: 'margin:18px 0' },
      h('h2', { style: 'font-size:22px;margin:0 0 10px' }, 'Connect once. StreamWing remembers the rest.'),
      h('p', {}, 'Watch the video, then follow the three steps below.'),
      h('video', { controls: true, preload: 'metadata', 'data-bigplay': '', poster: '/connect-to-chaturbate/StreamWing_connect_demo_poster.jpg', style: 'width:100%;border-radius:14px;display:block' },
        h('source', { src: '/connect-to-chaturbate/StreamWing_connect_demo.mp4', type: 'video/mp4' }), 'Your browser cannot play this video.')),
    h('div', { class: 'steps' },
      step('1', 'Open your Chaturbate token page',
        h('p', {}, 'Log in to the Chaturbate account you stream from.'),
        h('a', { class: 'btn', href: 'https://chaturbate.com/statsapi/authtoken/', target: '_blank', rel: 'noopener' }, 'Open Chaturbate token page')),
      step('2', 'Make a token',
        h('p', {}, 'Type ', h('b', {}, 'StreamWing'), ' as the name. Chaturbate ticks Stats API for you, so untick it. Tick ', h('b', {}, 'only Events API (public)'), '. Leave Events API empty. Then click ', h('b', {}, 'Generate Auth Token'), '.'),
        formPic),
      step('3', 'Copy your link and paste it here',
        h('p', {}, h('b', {}, 'Right-click the long link'), '. You do not need to highlight it.'),
        linkPic, ...pasteKids)),
    h('details', { class: 'stuck' }, h('summary', {}, 'Stuck? Common problems'),
      h('p', {}, h('b', {}, 'I see a login page, or the page won’t open. '), 'Log in to Chaturbate with the account you stream from, then open the token page again.'),
      h('p', {}, h('b', {}, 'StreamWing says this room already has an account. '), 'Open your StreamWing link. If you lost it, ', h('a', { href: '/connect/lost/' }, 'get it again'), '.'),
      h('p', {}, h('b', {}, 'StreamWing says Chaturbate didn’t accept it. '), 'The usual cause is a wrong box ticked. Make a new token with only Events API (public) ticked. You can delete old tokens on that same page.'),
      h('p', {}, h('b', {}, 'I made a token with Stats API ticked. '), 'Delete that token on the Chaturbate page, then make a new one with only Events API (public) ticked.'),
      h('p', {}, h('b', {}, 'Still stuck? '), 'Email ', h('a', { href: 'mailto:quietquotient79@gmail.com' }, 'quietquotient79@gmail.com'), ' or message us on Telegram at @couplefunchi.')),
    h('section', { class: 'sect' },
      h('p', { class: 'kicker' }, 'What it does'),
      h('h2', {}, 'Six things StreamWing does, in plain words.'),
      h('p', {}, 'Nothing here posts, sends or changes anything in your room.'),
      h('div', { class: 'feat' },
        h('div', { class: 'card' }, h('h3', {}, 'Remembers your regulars'), h('p', {}, 'StreamWing keeps a short record of people who visit your room: how often they come back and what they’ve tipped. When they arrive again, you see their card and a one-line note from last time.')),
        h('div', { class: 'card' }, h('h3', {}, 'Calls out who’s back'), h('p', {}, 'When a regular, a big tipper, or someone with tokens but no tip yet arrives, your panel calls them out. Use it to say hello at the right moment. You choose what to say.')),
        h('div', { class: 'card' }, h('h3', {}, 'Suggests a message'), h('p', {}, 'An optional small window beside your stream can suggest a short message when someone important arrives. You copy it and send it yourself. StreamWing never types or sends for you.')),
        h('div', { class: 'card' }, h('h3', {}, 'Tracks each stream'), h('p', {}, 'Your panel shows tokens, tips and visitors for the stream you’re on, with a running tip log. Growth over time is on the way.')),
        h('div', { class: 'card' }, h('h3', {}, 'Writes a recap'), h('p', {}, 'When a stream ends, StreamWing writes a short recap and a one-line note for the people who mattered. Those notes are there the next time they arrive, so you pick up where you left off. Notes are written after each stream ends, not during it.')),
        h('div', { class: 'card' }, h('h3', {}, 'Stays read-only'), h('p', {}, 'StreamWing only reads public room events. It keeps the last five chat messages from each viewer so it can remember them, and it never stores private messages. Disconnecting removes your token, so StreamWing loses access straight away.')))),
    h('section', { class: 'sect' },
      h('p', { class: 'kicker' }, 'While you stream'),
      h('h2', {}, 'Open StreamWing on your phone or a second screen.'),
      h('p', {}, 'It shows callouts as people arrive, so you can say hello to the right person at the right moment. You type every message yourself.'),
      h('div', { class: 'grid2' },
        h('div', { class: 'card' }, h('h3', {}, 'It shows you'),
          h('ul', { style: 'color:var(--soft);padding-left:20px;margin:0' },
            h('li', {}, 'Regulars who came back'),
            h('li', {}, 'Big tippers who are back in the room'),
            h('li', {}, 'Viewers with tokens who haven’t tipped yet'),
            h('li', {}, 'A running tip log and session totals'))))),
    h('section', { class: 'sect' },
      h('p', { class: 'kicker' }, 'Your control'),
      h('h2', {}, 'It only watches your room. You decide what happens next.'),
      h('div', { class: 'grid2' },
        h('div', { class: 'card' }, h('p', {}, 'StreamWing only reads public room events. It never posts, sends messages or touches your account.')),
        h('div', { class: 'card' }, h('p', {}, 'Disconnect any time. Deleting the token on Chaturbate cuts StreamWing off straight away. Next stream, StreamWing already knows your regulars.')))),
    h('p', { class: 'note' }, 'That link is the key to your room’s events. Paste it only here. You can disconnect any time, and deleting the token on Chaturbate cuts StreamWing off straight away.')));
}

setup();
}
</script>
