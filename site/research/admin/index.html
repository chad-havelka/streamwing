<style>
/* Researcher view. Access is enforced by the worker. This page holds no data until a token is entered. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.admin-wrap{box-sizing:border-box;width:100%;max-width:1100px;margin:0 auto;padding:var(--sp-top) 20px var(--sp-section)}
.admin{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px}
.panel h2{font-size:20px;margin:0 0 12px}
.panel p{font-size:15px;line-height:1.55;color:var(--soft);margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats dt{font-size:13px;color:var(--mute)}
.stats dd{margin:4px 0 0;font-size:24px;font-weight:600;color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.filters label,.field label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:0 0 6px}
.filters select,.filters input[type=text],.field input,.field select{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{min-height:44px;padding:10px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;color:var(--ink)}
th,td{padding:9px 10px;border-bottom:1px solid var(--rule,var(--line));text-align:left;vertical-align:top}
th{font-size:13px;color:var(--soft);font-weight:600;background:var(--panel2);white-space:nowrap}
td{min-width:90px}
td.wrapcell{min-width:200px}
details summary{cursor:pointer;color:var(--pink);font-size:14px}
details dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 14px;font-size:14px}
details dt{color:var(--mute)}
details dd{margin:0;color:var(--ink)}
.msg{font-size:15px;color:var(--soft);margin:10px 0 0;min-height:1.4em}
.msg.err{color:var(--err)}
.muted{color:var(--mute);font-size:14px}
.notice{padding:10px 12px;border-left:3px solid var(--err);background:var(--panel2);color:var(--ink);font-size:15px;border-radius:6px;margin:0 0 12px}
.linkbtn{background:none;border:0;color:var(--pink);font:inherit;font-size:15px;cursor:pointer;padding:8px 0;min-height:44px}
</style>
</head>
