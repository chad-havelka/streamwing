name: Acceptance CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, safeguards/acceptance-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: acceptance
          POSTGRES_DB: streamwing_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acceptance -d streamwing_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: worker
    env:
      TEST_DATABASE_URL: postgres://acceptance:acceptance@127.0.0.1:5432/streamwing_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Run acceptance tests with isolated PostgreSQL
        run: node --test --test-concurrency=1 --test-force-exit test/*.test.js
      - name: Run all original Owl evaluation scenarios
        env:
          EVAL_DATABASE_URL: postgres://acceptance:acceptance@127.0.0.1:5432/streamwing_acceptance
        run: node test/run-owl-eval.mjs
      - name: Upload Owl evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl-evaluation-results
          path: worker/test-results/owl-eval/
          if-no-files-found: error
