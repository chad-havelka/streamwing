  // The key stays in the address so "Open in Safari" and a home-screen icon keep working.
  // It's after the #, so it's never sent to any server.
  if (m) localStorage.setItem('sw_k', m[1]);

      h('button', { type: 'button', onclick: () => { coachRemove(q.username, true); coachAfterTap(win); coachDraw(); } }, 'Done'),
      h('button', { type: 'button', onclick: () => { coachRemove(q.username, true); coachAfterTap(win); coachDraw(); } }, 'Skip'),
      h('button', { type: 'button', onclick: () => { coach.queue.push(coach.queue.shift()); coachAfterTap(win); coachDraw(); } }, 'Later')),
    coach.note ? h('div', { class: 'cfoot' }, coach.note) : null,
    h('div', { class: 'cfoot' }, 'Only you see this. StreamWing never sends anything to Chaturbate for you.'));
}
function coachDraw() {
  const inline = $('coachInline');
  if (inline) {
    inline.className = 'coach inline';
    if (coach.pip) put(inline, h('div', { class: 'chead' }, h('span', {}, 'Nudges are in the pop-out window.'), h('button', { type: 'button', class: 'small', onclick: () => coach.pip && coach.pip.close() }, 'Bring back')));
    else put(inline, coachView(window));
  }
  if (coach.pip) { const root = coach.pip.document.getElementById('coachRoot'); if (root) put(root, coachView(coach.pip)); }
}
async function coachPop() {
  if (!window.documentPictureInPicture || coach.pip) return;
  try {
    const p = await documentPictureInPicture.requestWindow({ width: COACH_W, height: COACH_H_OPEN });
    p.document.head.append(p.document.importNode($('coachCss'), true));
    const f = p.document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap'; p.document.head.append(f);
    p.document.body.style.margin = '0';
    const root = p.document.createElement('div'); root.id = 'coachRoot'; root.className = 'coach pipbody'; p.document.body.append(root);
    coach.pip = p; coach.collapsed = false;
    p.addEventListener('pagehide', () => { coach.pip = null; coach.collapsed = false; coachDraw(); });
    coachDraw();
  } catch (e) { coachFlash('Could not open the pop-out here. You can keep using the strip on this page.'); coachDraw(); }
}

function onItem(item) {
  if (item.kind === 'heartbeat') return;
  if (item.kind === 'status') { refreshMe(); return; }
  if (item.kind === 'chat') {
    // Update what they just said, but only on this stream's cards. Older cards keep what they said back then.
    const latest = feedItems.find(f => f.session_id);
    const sid = latest && latest.kind !== 'recap' ? latest.session_id : null;
    if (!sid) return;
    document.querySelectorAll('.card').forEach(c => { if (c.dataset.user === item.username && c.dataset.session === sid) c.querySelector('.said').textContent = `“${item.data.message}”`; });
    for (const f of feedItems) if (f.username === item.username && f.session_id === sid && f.data.fan) f.data.fan.last_message = item.data.message;
    return;
  }
  if (item.kind === 'leave') {
    document.querySelectorAll('.card').forEach(c => { if (c.dataset.user === item.username) c.classList.add('gone'); });
    return;
  }
  feedItems.unshift(item);
  feedItems = feedItems.slice(0, 150);
  try { coachAdd(item); } catch (e) { /* the strip must never stop the feed */ }
  if (tab === 'callouts') {
    const el = renderItem(item);
    const list = $('list');
    if (el && list) { if (list.querySelector('.empty')) list.replaceChildren(); list.prepend(el); }
  } else if (tab === 'room') renderRoom();
  refreshMe();
}

let dropped = false, wake = null;
// Anything that happened while the phone slept or the connection was down: fetch it and redraw.
async function catchUp() {
  if (DEMO || !me) return;
  try {
    const { items } = await api('/api/feed?limit=80');
    feedItems = items;
    me = await api('/api/me');
    renderStats(); updateStatus(); renderList();
  } catch (e) {}
}
// While she's live and the panel is on screen, ask the phone not to dim and lock.
async function keepAwake() {
  try {
    const want = me && me.live && document.visibilityState === 'visible';
    if (want && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    if (!want && wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { catchUp(); keepAwake(); }
});

function stream() {
  if (DEMO) return demoStream();
  if (es) es.close();
  es = new EventSource(API + '/api/stream?k=' + encodeURIComponent(key));
  es.onmessage = ev => { try { onItem(JSON.parse(ev.data)); } catch (e) {} };
  es.onerror = () => { dropped = true; setStatus('Reconnecting…'); };
  es.onopen = () => { updateStatus(); if (dropped) { dropped = false; catchUp(); } };
}

async function load() {
  if (!key) return connectScreen({ displayName: 'there', username: 'your_username' }, true);
  try { me = await api('/api/me'); }
  catch (e) {
    if (e.status === 401) { try { localStorage.removeItem('sw_k'); } catch (x) {} return noKey("This link isn't working anymore. Ask StreamWing for a new one."); }
    setStatus('Offline'); app.replaceChildren(h('p', { class: 'empty' }, "Can't reach StreamWing right now. It will keep trying."));
    return setTimeout(load, 5000);
  }
  if (!me.connected) return connectScreen(me);
  document.querySelectorAll('.connect-page').forEach(el => el.classList.remove('connect-page'));
  const pubNav2 = document.getElementById('pubNav'); if (pubNav2) pubNav2.hidden = true;
  const { items } = await api('/api/feed?limit=80');
  feedItems = items;
  panel(); stream();
  try { await api('/api/settings', { method: 'POST', body: JSON.stringify({ timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }) }); } catch (e) {}
  clearInterval(meTimer); meTimer = setInterval(refreshMe, 30000);
}

// Settings sheet
$('menuBtn').addEventListener('click', () => { $('sheetInfo').textContent = me ? `Connected as ${me.username}. StreamWing remembers ${n(me.totals.fans)} people from your room.` : ''; $('sheetMsg').textContent = ''; $('sheet').hidden = false; });
$('closeSheet').addEventListener('click', () => { $('sheet').hidden = true; });
async function disconnect(deleteData) {
  if (deleteData && !confirm('Delete everything StreamWing knows about your room? This can’t be undone.')) return;
  try { await api('/api/disconnect', { method: 'POST', body: JSON.stringify({ deleteData }) }); $('sheet').hidden = true; if (es) es.close(); load(); }
  catch (e) { $('sheetMsg').className = 'msg err'; $('sheetMsg').textContent = e.message; }
}
$('discBtn').addEventListener('click', () => disconnect(false));
$('wipeBtn').addEventListener('click', () => disconnect(true));

// Keep the "2m ago" labels fresh without re-rendering.
setInterval(() => { if (tab === 'callouts') renderList(); }, 60000);

load();
}
</script>
</body>
